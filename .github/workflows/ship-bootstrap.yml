# One-time: run manually after adding repo secrets (DATABASE_URL, etc.).
# Actions runners can reach Supabase when Cloud Agent VMs cannot.
name: HydroIQ bootstrap

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
